<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> html table example</h1>
    <table border="1">
        <tr>
            <td >Product</td>
            <td>flavour</td>
        </tr>
        <tr>
            <td rowspan="3">MILK</td>
            <td>almond</td>
        </tr>
        <tr>
            <td>chocalate</td>
        </tr>
        <tr> 
            <td>vanila</td>
        </tr>
        <tr>
          <td colspan="2">these are exclusive flavor</td>
        </tr>
    </table>
    <br>
    <table border="2" bgcolor="pink"  cellspacing="2" cellpadding="10" align="center" frame="box" rule="all">
        <tr colspan="5">
            <td>lab2</td>
        </tr>
        <tr>
            <td>cell1</td>
            <td rowspan="2">cell2</td>
            <td colspan="2">cell3</td>
            <td>cell4</td>
        </tr>
        <tr>
            <td>cell5</td>
            <td colspan="2">cell7</td>
            <td>cell8</td>
        </tr>
    </table>

</body>
</html>
