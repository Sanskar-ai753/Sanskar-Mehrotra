<!DOCTYPE html>
<html>
    <head>
        <title>Course Registration</title>
    </head>
    <body>
        <div border="2px" >
            <caption>Course Registration</caption>
            <form>
                <div>
                   <label for="username">Enter Username</label><br>
                   <input id="username" name="username" type="text" placeholder="Enter Username"><br>
                </div>
                <div>
                   <label for="email">Enter Email</label><br>
                   <input name="email" type="email" placeholder="name@gmail.com"><br>
                </div>
                <div>
                    <label for="password">Password</label><br>
                    <input name="password" type="password" min="8" placeholder="At least 8 characters">
                </div>
                <div>
                    <label for="">Phone Number</label><br>
                    <input name="" type="number" placeholder="10-digit mobile number"><br>
                </div>
                <div>
                    <select name="category">
                        <label>Select a course</label>
                        <option>choose a course</option>
                        <option>html</option>
                        <option>css</option>
                        <option>js</option>
                    </select><br>
                </div>
                <div>
                    <label>Prefered learning mode</label><br>
                    <input type="radio">online
                    <input type="radio">offline
                </div>
                <input type="checkbox"> I accept terms and conditions<br><br>
                <input type="submit">
                <input type="reset">
            </form>
        </div>
    </body>
</html>
