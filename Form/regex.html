<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Reuglar Expression</h1>
    <form>
        <label>Use of ?</label>
        <input type="text" pattern="colou?r"><br><br>
        <label>Use of *</label>
        <input type="text" pattern="adfa*r"><br><br>
        <label>Use of +</label>
        <input type="text" pattern="ab+c"><br><br>
        <label>Use of .</label>
        <input type="text" pattern="a.c"><br><br>
        <label>Use of \</label>
        <input type="text" pattern="adfar\.com"><br><br>
        <label>Use of |</label>
        <input type="text" pattern="cat|dog"><br><br>
        <label>Use of ()</label>
        <input type="text" pattern="(cat)+"><br><br>
        <label>Use of ^</label>
        <input type="text" pattern="^cat"><br><br>
        <label>Use of []</label>
        <input type="text" pattern="[aeionjdn]"><br><br>
        <input type="text" pattern="[0-9]"><br><br>
        <button type="submit">Submit</button>

    </form>
    
</body>
</html>
